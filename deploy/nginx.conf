# NGINX in front of tavernkeep: gzip and a per-client request rate limit.

limit_req_zone $binary_remote_addr zone=tk_per_ip:10m rate=20r/s;
limit_req_status 429;

upstream tavernkeep {
    server tavernkeep:8080;
    keepalive 32;
}

server {
    listen 80;

    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;

    location / {
        limit_req zone=tk_per_ip burst=40 nodelay;

        proxy_pass http://tavernkeep;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 15s;
    }
}
