# NGINX in front of tavernkeep: gzip and a per-client request rate limit.

limit_req_zone $binary_remote_addr zone=tk_per_ip:10m rate=20r/s;
limit_req_status 429;

# Re-resolve the app container through Docker's DNS so a recreated
# container (new IP) is picked up instead of returning 502.
resolver 127.0.0.11 valid=2s ipv6=off;

upstream tavernkeep {
    zone tavernkeep 64k;
    server tavernkeep:8080 resolve;
    keepalive 32;
}

server {
    listen 80;

    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;

    location / {
        limit_req zone=tk_per_ip burst=40 nodelay;

        proxy_pass http://tavernkeep;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 15s;
    }
}
