[package]
name = "tavernkeep"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Noah Naiman"]
description = "A fast, outage-proof D&D 5e SRD lookup API backed by Open5e"
license = "MIT"
readme = "README.md"
publish = false

[dependencies]
axum = "0.8"
bytes = "1"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
moka = { version = "0.12", features = ["future"] }
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "net", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

[dev-dependencies]
proptest = "1"
tower = { version = "0.5", features = ["util"] }
wiremock = "0.6"
